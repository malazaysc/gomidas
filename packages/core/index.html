<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gomidas</title>
  <style>
    :root {
      color-scheme: dark;
      --chrome: #1f1f27; --chrome2: #151519; --panel: #1e1e25; --panel2: #26262f;
      --line: #0e0e12; --line2: #33333d; --text: #e4e4ea; --dim: #9a9aa6;
      --accent: #7b5cff; --accent2: #5b3fd6; --hover: #2d2d37;
      --ctrl: #2a2a33;            /* neutral control background */
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--chrome2); color: var(--text);
                 font-family: -apple-system, system-ui, sans-serif; overflow: hidden; font-size: 13px; }
    body { display: flex; flex-direction: column; height: 100vh; }
    button, select, input { font-family: inherit; }

    /* ---------- top transport ---------- */
    #transport { flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
                 padding: 6px 8px; background: linear-gradient(#24242c, #191920);
                 border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .tp-group { display: flex; align-items: center; gap: 3px; flex: 0 1 auto; flex-wrap: wrap; }
    .tp-center { margin: 0 auto; }
    .tp-right { margin-left: auto; min-width: 0; }
    .tp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px;
              background: var(--ctrl); color: var(--text); border: 1px solid var(--line);
              border-radius: 6px; min-width: 30px; height: 28px; padding: 0 7px; cursor: pointer;
              font-size: 13px; flex: 0 0 auto; }
    .tp-btn:hover { background: var(--hover); }
    .tp-btn.lg { font-size: 16px; }
    .tp-ic-static { color: var(--dim); flex: 0 0 auto; }
    #zoom-pct { color: var(--dim); min-width: 38px; text-align: center; flex: 0 0 auto; font-size: 12px; }
    #tp-timesig { cursor: pointer; padding: 0 3px; border-radius: 4px; font-variant-numeric: tabular-nums; }
    #tp-timesig:hover { background: var(--hover); color: var(--text); }
    .tp-btn.on { background: var(--accent); border-color: var(--accent2); color: #fff; }
    .tp-btn.rec { background: #c0392b; border-color: #e74c3c; color: #fff; }
    #vu { width: 60px; height: 10px; background: #2a2a30; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
    #vu-fill { height: 100%; width: 0%; background: #5c8; transition: width .05s linear; }
    .tp-play { background: var(--accent); border-color: var(--accent2); min-width: 40px; font-size: 16px; }
    .tp-play:hover { background: #9476ff; }
    #transport select, #transport input { background: var(--ctrl); color: var(--text);
              border: 1px solid var(--line); border-radius: 6px; height: 28px; padding: 0 8px; cursor: pointer; }
    #transport input[type=number] { width: 60px; cursor: text; }
    #tp-trackchip { display: flex; flex-direction: column; justify-content: center; align-items: center;
              min-width: 150px; height: 40px; padding: 2px 12px; background: #1d1d21;
              border: 1px solid var(--line); border-radius: 8px; flex: 0 0 auto; }
    #tp-track { font-weight: 600; font-size: 13px; }
    #tp-sub { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
    #status { font-size: 11px; color: var(--dim); max-width: 120px; min-width: 0; flex: 1 1 auto;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tp-tempo { display: flex; align-items: center; gap: 4px; color: var(--dim); }
    .tp-sep { width: 1px; height: 22px; background: var(--line2); margin: 0 3px; flex: 0 0 1px; }
    .tp-views, .tp-instr { display: flex; gap: 2px; }
    .tp-btn.vw { min-width: 28px; padding: 0 6px; }
    .tp-btn.vw.on { background: var(--accent); border-color: var(--accent2); color: #fff; }
    .tp-speed { display: flex; align-items: center; gap: 4px; color: var(--dim); }
    #tp-track-line { display: flex; align-items: center; gap: 6px; }
    .tp-btn[disabled] { opacity: .4; cursor: default; }
    .tp-btn[disabled]:hover { background: var(--ctrl); }

    /* ---------- main row ---------- */
    #main { flex: 1 1 auto; display: flex; min-height: 0; }

    /* left palette */
    #palette { flex: 0 0 210px; background: var(--chrome); border-right: 1px solid var(--line);
               overflow-y: auto; padding: 8px; }
    #editbar { display: flex; flex-direction: column; gap: 10px; }
    .eb-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
                padding-bottom: 8px; border-bottom: 1px solid var(--line2); }
    .eb-group:last-child { border-bottom: none; }
    .eb-label { width: 100%; font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
                color: var(--dim); margin-bottom: 2px; }
    .eb-btn { background: var(--ctrl); color: var(--text); border: 1px solid var(--line);
              border-radius: 6px; min-width: 30px; height: 28px; padding: 0 7px; cursor: pointer; font-size: 13px; line-height: 1; }
    .eb-btn:hover { background: var(--hover); }
    .eb-btn.active { background: var(--accent); border-color: var(--accent2); color: #fff; }
    .eb-btn.eb-sq { min-width: 30px; width: 30px; padding: 0; }
    .eb-btn.eb-wide { flex: 1; }
    .eb-btn.eb-dyn { min-width: 26px; width: 26px; padding: 0; font-style: italic; font-weight: 700; font-size: 11px; }
    .eb-btn.eb-todo { opacity: .42; cursor: default; }
    .eb-btn.eb-todo:hover { background: var(--ctrl); }
    /* Deferred (not-yet-implemented) controls: dimmed + non-interactive, with a "soon" tag. */
    .gd-soon { opacity: .4; pointer-events: none; }
    .gd-soon-tag { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim);
                   border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; margin-left: 6px; opacity: .7; }
    .eb-voice.active { background: var(--accent); border-color: var(--accent2); color: #fff; }

    /* center */
    #center { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
    #at-wrap { flex: 1 1 auto; overflow: auto; background: #2a2a31; padding: 22px;
               outline: none; }
    /* Panel collapse / full-view (session view state; toggled via transport + View menu). */
    body.hide-palette #palette { display: none; }
    body.hide-inspector #inspector { display: none; }
    body.hide-tracks #tracks { display: none; }
    body.hide-fretboard #fretboard { display: none; }
    body.fullscore #palette, body.fullscore #inspector,
    body.fullscore #tracks, body.fullscore #fretboard { display: none; }
    .tp-btn.on { background: var(--accent); color: #fff; }
    .tp-glyph { font-size: 15px; line-height: 1; }
    /* count-in visual countdown (big centered number over the score) */
    #countdown-ov { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
      display: none; align-items: center; justify-content: center; font-size: 140px; font-weight: 800;
      color: rgba(255,255,255,.92); text-shadow: 0 4px 28px rgba(0,0,0,.7); pointer-events: none; z-index: 9999; }
    #countdown-ov.pulse { animation: cd-pulse .45s ease-out; }
    @keyframes cd-pulse { 0% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
      30% { opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: .9; } }
    .countin-bars { width: 42px; font-size: 11px; } /* count-in length selector */
    #at { padding: 24px; position: relative; background: #fff; color: #111; border-radius: 3px;
          box-shadow: 0 6px 30px rgba(0,0,0,.5); min-height: 100%; }
    #edit-cursor { position: absolute; pointer-events: none; display: none; z-index: 4;
                   background: rgba(90,160,255,.10); border: 1px solid rgba(90,160,255,.45); border-radius: 2px; }
    #string-cursor { position: absolute; pointer-events: none; display: none; z-index: 6;
                   background: rgba(60,130,255,.30); border: 1px solid rgba(60,130,255,.95); border-radius: 3px; }
    #play-cursor { position: absolute; pointer-events: none; display: none; z-index: 4;
                   background: rgba(120,230,140,.30); border-left: 2px solid rgba(120,230,140,.95); }
    .sel-cell { position: absolute; pointer-events: none; display: none; z-index: 3;
                background: rgba(255,190,70,.22); border-radius: 2px; }
    /* Drawer handles: every dockable panel gets a small chevron button that collapses it
       in place to a thin rail (re-expand by clicking the rail's chevron). */
    .drawerable { position: relative; }
    .drawer-tab { position: absolute; z-index: 40; display: flex; align-items: center; justify-content: center;
                  gap: 6px; width: 18px; height: 18px; padding: 0; line-height: 1; font-size: 12px; border-radius: 4px;
                  background: var(--ctrl); color: var(--dim); border: 1px solid var(--line); cursor: pointer; }
    .drawer-tab:hover { color: #fff; background: var(--accent); border-color: var(--accent2); }
    .drawer-title { display: none; font-size: 10px; font-weight: 700; letter-spacing: .07em;
                    text-transform: uppercase; }
    .drawer-left > .drawer-tab, .drawer-right > .drawer-tab { top: 6px; right: 6px; }
    .drawer-bottom > .drawer-tab { top: 5px; right: 8px; }
    /* collapsed → thin rail; hide the panel body; the whole rail becomes the labelled handle */
    #palette.collapsed, #inspector.collapsed { flex: 0 0 24px !important; width: 24px !important;
                  min-width: 24px !important; padding: 0 !important; overflow: hidden; }
    #fretboard.collapsed { max-height: 24px !important; min-height: 24px !important; height: 24px !important;
                  padding: 0 !important; overflow: hidden; }
    #beatlane-panel.collapsed { height: 24px !important; overflow: hidden; }
    #tracks.collapsed { max-height: 24px !important; overflow: hidden; }
    .drawerable.collapsed > :not(.drawer-tab) { display: none !important; }
    .drawerable.collapsed > .drawer-tab { inset: 0; width: auto; height: auto; transform: none;
                  border: none; border-radius: 0; background: transparent; }
    .drawerable.collapsed > .drawer-tab:hover { background: var(--hover); color: var(--text); }
    .drawerable.collapsed .drawer-title { display: inline-block; }
    .drawer-left.collapsed > .drawer-tab, .drawer-right.collapsed > .drawer-tab { flex-direction: column; padding-top: 8px; }
    .drawer-left.collapsed .drawer-title, .drawer-right.collapsed .drawer-title {
                  writing-mode: vertical-rl; text-orientation: mixed; }

    /* Time-grid tab ("piano roll for tabs"): a consistent rhythm view below the score,
       drawn on canvas. The grid represents TIME (every 4/4 bar the same width, columns
       adapt to the smallest value in the bar); fret numbers sit on string rows at their
       start time. The engraved tab above stays the source of truth. */
    #beatlane-panel { flex: 0 0 auto; height: 184px; display: flex; background: #101015;
                      border-top: 1px solid var(--line); }
    body.hide-beatlane #beatlane-panel { display: none; }
    #beatlane-gutter { flex: 0 0 auto; width: 34px; height: 100%; background: #0c0c10;
                       border-right: 1px solid var(--line); }
    #beatlane-wrap { flex: 1 1 auto; position: relative; overflow-x: auto; overflow-y: hidden; }
    #beatlane { display: block; }
    .bl-edit { position: absolute; pointer-events: none; display: none; z-index: 2;
               background: rgba(123,92,255,.16); border-left: 1px solid rgba(123,92,255,.6);
               border-right: 1px solid rgba(123,92,255,.6); }
    .bl-play { position: absolute; pointer-events: none; display: none; z-index: 3; width: 2px;
               background: #5ce08a; box-shadow: 0 0 6px rgba(92,224,138,.8); }

    /* fretboard / drum palette (center bottom) */
    #fretboard { flex: 0 0 auto; max-height: 240px; background: #211c17; border-top: 2px solid var(--line);
                 padding: 8px 12px; overflow: auto; }
    .fb-grid { display: grid; gap: 0; min-width: 760px; }
    .fb-corner, .fb-fnum, .fb-strlabel, .fb-cell { height: 24px; display: flex;
                 align-items: center; justify-content: center; font-size: 12px; }
    .fb-fnum { color: #8a7f70; font-size: 11px; }
    .fb-fnum.fb-marker { color: #d9c089; font-weight: 700; }
    .fb-strlabel { color: #d8c9a8; font-weight: 700; background: #2c251d; border-right: 2px solid #000; }
    .fb-cell { position: relative; border: 1px solid #3a3026; background: #2a231b; cursor: pointer; }
    .fb-cell:hover { background: #4a3d2c; }
    .fb-cell.fb-open { background: #241f18; border-left: 3px solid #000; }
    .fb-cell.fb-curstr { background: #332a1f; }
    .fb-cell.fb-curstr:hover { background: #4a3d2c; }
    .fb-cell.fb-inlay::before { content: ''; position: absolute; width: 9px; height: 9px;
               border-radius: 50%; background: #5a4d38; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .fb-dot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
              width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff;
              display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; z-index: 1; }
    /* ===== Drum KIT VIEW panel (shown for percussion tracks) ===== */
    /* Height is user-adjustable (--drum-h, set/persisted in JS) so the score can breathe
       on small screens; the score (#at-wrap, flex:1) takes whatever's left. */
    #fretboard.kit { height: var(--drum-h, 360px); max-height: none; background: #14141a;
                     padding: 0; position: relative; }
    #fretboard.kit.collapsed { height: 38px; overflow: hidden; }
    #fretboard.kit.collapsed .dp-body, #fretboard.kit.collapsed .pattern-lib { display: none; }
    .drumpanel { display: flex; flex-direction: column; height: 100%; }
    /* draggable splitter on the top edge — drag to resize, dbl-click to collapse */
    .dp-splitter { position: absolute; top: 0; left: 0; right: 0; height: 8px; cursor: row-resize; z-index: 6; }
    .dp-splitter::after { content: ''; position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
                          width: 48px; height: 3px; border-radius: 3px; background: var(--line2); }
    .dp-splitter:hover::after { background: var(--accent); }
    body.dp-resizing { cursor: row-resize; user-select: none; }
    /* drum-panel header controls (right side of the tab row) */
    .dp-ctl { margin-left: auto; display: flex; align-items: center; gap: 4px; padding: 0 4px 4px 0; }
    .dp-hbtn { background: var(--ctrl); color: var(--dim); border: 1px solid var(--line); border-radius: 6px;
               height: 24px; min-width: 26px; padding: 0 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .dp-hbtn:hover { color: var(--text); }
    .dp-hbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .dp-tabs { display: flex; align-items: flex-end; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
    .dp-tab { background: transparent; color: var(--dim); border: none; border-radius: 8px 8px 0 0;
              padding: 8px 18px; font-size: 12px; font-weight: 700; letter-spacing: .04em; cursor: pointer; }
    .dp-tab:hover { color: var(--text); }
    .dp-tab.active { background: var(--accent); color: #fff; }
    .dp-body { flex: 1 1 auto; display: flex; gap: 10px; padding: 10px; min-height: 0; }
    .dp-pane { display: none; flex: 1 1 auto; min-width: 0; gap: 10px; }
    .dp-pane.active { display: flex; }
    .dp-placeholder { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
                      color: var(--dim); font-size: 13px; border: 1px dashed var(--line2); border-radius: 10px; }

    /* Quick Tools rail */
    .kit-tools { flex: 0 0 156px; background: #1b1b22; border: 1px solid var(--line2); border-radius: 10px;
                 padding: 10px; display: flex; flex-direction: column; gap: 3px; }
    .kit-h { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 6px; }
    .qtool { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; cursor: pointer;
             color: var(--text); font-size: 12px; user-select: none; }
    .qtool:hover { background: var(--hover); }
    .qtool.active { background: var(--accent); color: #fff; }
    .qtool .qk { margin-left: auto; font-size: 10px; color: var(--dim); }
    .qtool.active .qk { color: #e8e0ff; }
    .qtool svg { width: 15px; height: 15px; }

    /* Kit stage + hotspots */
    .kit-stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
                 background: #0c0c10; border-radius: 10px; min-width: 0; overflow: hidden; }
    .kit-frame { position: relative; height: 100%; aspect-ratio: 1536 / 1024; max-width: 100%; }
    .kit-frame img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
    .kit-hot { position: absolute; transform: translate(-50%, -50%); border-radius: 50%;
               border: 2px solid transparent; cursor: pointer; }
    .kit-hot:hover { border-color: #ffffff66; background: #ffffff12; }
    .kit-hot.hit { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 24%, transparent); }
    .kit-hot.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
    .kit-lbl { position: absolute; left: 50%; bottom: -2px; transform: translate(-50%, 100%);
               background: #000a; color: #fff; font-size: 10px; font-weight: 600; padding: 1px 6px;
               border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; }
    .kit-hot:hover .kit-lbl, .kit-hot.sel .kit-lbl { opacity: 1; }

    /* Articulation panel */
    .kit-artic { flex: 0 0 210px; background: #1b1b22; border: 1px solid var(--line2); border-radius: 10px;
                 padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
    .kit-artic .apiece { font-size: 14px; font-weight: 700; }
    .artic-opt { padding: 8px 10px; border-radius: 8px; background: #24242c; border: 1px solid var(--line2);
                 cursor: pointer; font-size: 12px; }
    .artic-opt:hover { background: var(--hover); }
    .artic-opt.active { background: var(--accent); border-color: var(--accent2); color: #fff; }
    .kit-srow { margin-top: 8px; }
    .kit-srow .lab { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim);
                     display: flex; justify-content: space-between; margin-bottom: 4px; }
    .kit-srow input[type=range] { width: 100%; }

    /* Pattern library (always-visible row under the kit) */
    .pattern-lib { flex: 0 0 130px; display: flex; gap: 10px; padding: 0 10px 10px; min-height: 0; }
    .pl-cats { flex: 0 0 156px; background: #1b1b22; border: 1px solid var(--line2); border-radius: 10px;
               padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
    .pl-cats input { background: #14141a; border: 1px solid var(--line2); border-radius: 6px; color: var(--text);
                     padding: 5px 8px; font-size: 11px; margin-bottom: 6px; }
    .pl-cat { padding: 5px 8px; border-radius: 6px; font-size: 12px; color: var(--dim); cursor: pointer; }
    .pl-cat:hover { background: var(--hover); color: var(--text); }
    .pl-cat.active { background: var(--accent); color: #fff; }
    .pl-cards { flex: 1 1 auto; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; min-width: 0; }
    .pl-card { flex: 0 0 132px; background: #1b1b22; border: 1px solid var(--line2); border-radius: 10px;
               padding: 9px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; }
    .pl-card:hover { border-color: #6a6a78; }
    .pl-card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .pl-card .pl-name { font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .pl-card .pl-fav { cursor: pointer; color: var(--dim); font-size: 13px; }
    .pl-card .pl-fav.on { color: #e0556e; }
    .pl-dots { display: flex; flex-direction: column; gap: 3px; }
    .pl-dotrow { display: flex; gap: 2px; }
    .pl-dot { width: 6px; height: 6px; border-radius: 2px; background: #2f2f38; }
    .pl-dot.on { background: var(--accent); }
    .pl-dot.on.k { background: #d4673e; }
    .pl-card .pl-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .pl-play { width: 24px; height: 24px; border-radius: 6px; background: var(--ctrl); border: 1px solid var(--line);
               display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }
    .pl-play:hover { background: var(--hover); }
    .pl-play.on { background: var(--accent); border-color: var(--accent2); color: #fff; }
    .pl-add { flex: 0 0 92px; border: 1px dashed var(--line2); border-radius: 10px; display: flex; flex-direction: column;
              align-items: center; justify-content: center; gap: 4px; color: var(--dim); cursor: pointer; font-size: 12px; }
    .pl-add:hover { color: var(--text); border-color: #6a6a78; }

    /* Groove step-grid editor */
    .ge { flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px; overflow: auto; }
    .ge-row { display: flex; align-items: center; gap: 6px; }
    .ge-lane { flex: 0 0 64px; font-size: 11px; color: var(--dim); text-align: right; }
    .ge-cells { display: flex; gap: 2px; }
    .ge-cell { width: 20px; height: 18px; border-radius: 3px; background: #24242c; border: 1px solid var(--line2); cursor: pointer; }
    .ge-cell:hover { border-color: #6a6a78; }
    .ge-cell.beat { background: #2b2b35; }            /* downbeat column tint */
    .ge-cell.on { background: var(--accent); border-color: var(--accent2); }
    .ge-cell.on.acc { background: #9476ff; }
    .ge-cell.on.gho { background: color-mix(in srgb, var(--accent) 45%, #14141a); }

    /* inspector drum extras (Generate Variation, Insert Options) */
    .insp-bigbtn { width: 100%; padding: 9px; border-radius: 8px; background: var(--ctrl); color: var(--text);
                   border: 1px solid var(--line2); cursor: pointer; font-size: 12px; font-weight: 600; }
    .insp-bigbtn:hover { background: var(--hover); }
    .insp-bigbtn.primary { background: var(--accent); border-color: var(--accent2); color: #fff; margin-top: 8px; }
    .insp-bigbtn.primary:hover { background: #9476ff; }
    .insp-voices { display: flex; gap: 4px; }
    .insp-voices .iv { width: 26px; height: 24px; display: flex; align-items: center; justify-content: center;
                       border-radius: 6px; background: var(--ctrl); border: 1px solid var(--line2); cursor: pointer; font-size: 12px; }
    .insp-voices .iv.on { background: var(--accent); border-color: var(--accent2); color: #fff; }

    /* kit MIXER tab */
    .kit-mixer { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; padding: 4px 6px; overflow-y: auto; }
    .km-row { display: flex; align-items: center; gap: 10px; }
    .km-name { flex: 0 0 88px; font-size: 12px; color: var(--text); }
    .km-row input[type=range] { flex: 1 1 auto; }
    .kmv { flex: 0 0 42px; text-align: right; font-size: 11px; color: var(--dim); }

    /* right inspector */
    #inspector { flex: 0 0 250px; background: var(--chrome); border-left: 1px solid var(--line);
                 overflow-y: auto; padding: 0; }
    .insp-tabs { display: flex; border-bottom: 1px solid var(--line); }
    .insp-tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 600;
                color: var(--dim); cursor: default; }
    .insp-tab.active { color: #fff; background: var(--accent); }
    .insp-sec { padding: 12px 14px; border-bottom: 1px solid var(--line2); }
    .insp-h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; }
    .insp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; font-size: 12px; }
    .insp-row .v { color: var(--text); }
    .insp-name { background: #1d1d21; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-weight: 600; }
    .insp-pill { display: inline-flex; gap: 6px; }
    .insp-pill span { padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--ctrl); font-size: 11px; }
    .insp-pill span.on { background: var(--accent); border-color: var(--accent2); color: #fff; }
    /* Engine status badge — a label, NOT a button (no hand cursor, no click) */
    .insp-engine { padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600;
                   cursor: default; user-select: none; letter-spacing: .02em; }
    .insp-engine.is-midi { background: var(--ctrl); border: 1px solid var(--line); color: var(--dim); }
    .insp-engine.is-sample { background: var(--accent); border: 1px solid var(--accent2); color: #fff; }
    .insp-btn { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ctrl); color: var(--text); font-size: 11px; cursor: pointer; }
    .insp-btn:hover { border-color: var(--accent2); }
    .insp-sfz { font-size: 11px; color: var(--dim); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .insp-tuning { font-family: ui-monospace, monospace; letter-spacing: .12em; background: #1d1d21;
                   border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
    .insp-slider { -webkit-appearance: none; width: 120px; height: 4px; border-radius: 2px; background: #4a4a52; }
    .insp-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); }
    .insp-toggle { width: 34px; height: 18px; border-radius: 9px; background: #4a4a52; position: relative; }
    .insp-toggle.on { background: var(--accent); }
    .insp-toggle::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%;
                          background: #fff; top: 2px; left: 2px; transition: left .1s; }
    .insp-toggle.on::after { left: 18px; }
    .insp-info { display: flex; align-items: center; gap: 6px; }
    .insp-swatch { flex: 0 0 14px; width: 14px; height: 22px; border-radius: 3px; }
    .insp-tico { color: var(--dim); display: flex; }
    .insp-info .insp-input { flex: 1 1 auto; }
    .insp-short { flex: 0 0 auto; font-size: 10px; color: var(--dim); background: #1d1d21;
                 border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
    .insp-noticons span, .insp-pill span { display: inline-flex; align-items: center; gap: 4px; }
    .insp-tunwrap { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); }
    .insp-chain { display: inline-flex; gap: 6px; color: var(--dim); }

    /* bottom track list */
    #tracks { flex: 0 0 auto; max-height: 168px; overflow-y: auto; background: var(--chrome2);
              border-top: 1px solid var(--line); }
    .tk-head { display: flex; align-items: center; gap: 10px; padding: 5px 10px; color: var(--dim);
               font-size: 11px; border-bottom: 1px solid var(--line2); }
    .tk-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; cursor: pointer;
              border-bottom: 1px solid var(--line2); }
    .tk-row:hover { background: #2c2c32; }
    .tk-row.current { background: #233153; }
    .tk-ico { width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
              background: #44444c; font-size: 13px; }
    .tk-name { flex: 1; font-weight: 600; font-size: 13px; }
    .tk-badge { font-size: 10px; color: var(--dim); }
    .tk-ctl { display: flex; gap: 4px; }
    .tk-mini { width: 22px; height: 22px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--line);
               display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--dim); cursor: pointer; }
    .tk-mini:hover { background: var(--hover); }
    .tk-mini.on { color: #cfe0ff; }
    .tk-mini.mute { background: #c0533a; border-color: #8c331f; color: #fff; }
    .tk-mini.solo { background: #d6a32a; border-color: #9c7414; color: #1b1b1f; }
    .tk-vol { width: 110px; }
    input.tk-volrange { -webkit-appearance: none; width: 110px; height: 4px; border-radius: 2px;
               background: #4a4a52; cursor: pointer; vertical-align: middle; }
    input.tk-volrange::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px;
               border-radius: 50%; background: var(--accent); cursor: pointer; }

    /* ---- GP8 track section (controls + per-bar timeline) ---- */
    #tracks { max-height: 210px; }
    .tk-head2 { display: flex; align-items: stretch; color: var(--dim); font-size: 11px;
               border-bottom: 1px solid var(--line2); background: #202024; position: sticky; top: 0; z-index: 2; }
    .tk-hc { flex: 0 0 var(--tk-ctrlw, 392px); display: flex; align-items: center; gap: 4px;
               padding: 4px 8px; border-right: 1px solid var(--line2); }
    .tk-tool { width: 24px; height: 22px; display: flex; align-items: center; justify-content: center;
               border-radius: 4px; color: var(--dim); cursor: pointer; }
    .tk-tool:hover { background: var(--hover); color: var(--text); }
    .tk-collabels { margin-left: auto; display: flex; gap: 0; color: var(--dim); }
    .tk-collabels span { text-align: center; font-size: 10px; }
    .tk-cl-vol { width: 92px; } .tk-cl-pan { width: 34px; } .tk-cl-eq { width: 30px; }
    .tk-ruler { flex: 1 1 auto; display: grid; gap: 1px; padding: 0 6px; align-items: center;
               justify-content: start; min-width: 0; overflow-x: auto; overflow-y: hidden; }
    .tk-ruler span { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: visible; }
    /* the ruler carries the visible horizontal scrollbar for the whole timeline */
    .tk-ruler::-webkit-scrollbar { height: 8px; }
    .tk-ruler::-webkit-scrollbar-thumb { background: #4a4a52; border-radius: 4px; }

    .tk-row2 { display: flex; align-items: stretch; border-bottom: 1px solid var(--line2);
               cursor: pointer; min-height: 40px; }
    .tk-row2:hover { background: #2c2c32; }
    .tk-row2.current { background: #2a2440; }
    .tk-row2.master { background: #1a1a20; cursor: default; }
    .tk-ctrls { flex: 0 0 var(--tk-ctrlw, 392px); display: flex; align-items: center; gap: 6px;
               padding: 4px 8px; border-right: 1px solid var(--line2); min-width: 0; }
    .tk-swatch { flex: 0 0 5px; align-self: stretch; border-radius: 2px; margin: 5px 0; background: #555; }
    .tk-ico2 { flex: 0 0 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: var(--dim); }
    .tk-name2 { flex: 1 1 auto; min-width: 24px; font-weight: 600; font-size: 12px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tk-fader { flex: 0 0 92px; display: flex; align-items: center; gap: 5px; }
    .tk-fader input { -webkit-appearance: none; width: 62px; height: 4px; border-radius: 2px;
               background: #4a4a52; cursor: pointer; }
    .tk-fader input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px;
               border-radius: 50%; background: var(--accent); cursor: pointer; }
    .tk-fader .v { width: 24px; font-size: 10px; color: var(--dim); text-align: right; }
    .tk-knob { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
               background: var(--ctrl); position: relative; cursor: pointer; }
    .tk-knob::after { content: ''; position: absolute; left: 50%; top: 3px; width: 2px; height: 8px;
               background: var(--text); border-radius: 1px; transform-origin: 1px 10px; transform: translateX(-1px) rotate(var(--ang, 0deg)); }
    .tk-eq { flex: 0 0 26px; }

    .tk-bars { flex: 1 1 auto; display: grid; gap: 1px; padding: 6px; align-content: center;
               justify-content: start; min-width: 0; overflow-x: auto; overflow-y: hidden;
               scrollbar-width: none; }
    .tk-bars::-webkit-scrollbar { display: none; } /* rows scroll-sync to the ruler; hide their bars */
    /* Continuous colored band per track: empty bars show a dim tint of the track color,
       bars with notes show the full color (GP-style timeline). */
    .tk-bar { height: 20px; border-radius: 2px; cursor: pointer;
              background: color-mix(in srgb, var(--bc, #555) 26%, #14141a); }
    .tk-bar:hover { outline: 1px solid #fff5; outline-offset: -1px; }
    .tk-bar.fill { background: var(--bc, var(--accent)); }
    /* GP-style bar-fill markers: amber dot = incomplete, red = overfilled */
    .tk-bar.bf-under.fill { background: linear-gradient(var(--bc, var(--accent)), var(--bc, var(--accent))); }
    .tk-bar.bf-under::after { content: ''; position: absolute; right: 1px; bottom: 1px; width: 4px; height: 4px;
                              border-radius: 50%; background: #f5a623; }
    .tk-bar.bf-over { outline: 1.5px solid #e5484d; outline-offset: -1.5px; }
    .tk-bar.bf-over::after { content: ''; position: absolute; right: 1px; bottom: 1px; width: 4px; height: 4px;
                             border-radius: 50%; background: #e5484d; }
    .tk-bar { position: relative; }
    .tk-bar.cur { box-shadow: inset 0 0 0 1.5px #fff; }

    /* editable inspector controls */
    .insp-input { background: #1d1d21; border: 1px solid var(--line); border-radius: 6px;
               padding: 6px 10px; color: var(--text); font-weight: 600; width: 100%; }
    .insp-select { background: var(--ctrl); border: 1px solid var(--line); border-radius: 6px;
               padding: 5px 8px; color: var(--text); font-size: 12px; }
    .insp-tab { cursor: pointer; }
    .insp-pill span { cursor: pointer; user-select: none; }

    /* ---------- modal (New score / confirm) ---------- */
    #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
               align-items: center; justify-content: center; z-index: 50; }
    #modal-overlay.show { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px;
               box-shadow: 0 18px 60px rgba(0,0,0,.6); width: 520px; max-width: 92vw;
               max-height: 88vh; overflow: auto; }
    .modal-h { padding: 14px 18px; font-size: 15px; font-weight: 700; border-bottom: 1px solid var(--line); }
    .modal-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
    .modal-foot { padding: 12px 18px; display: flex; justify-content: flex-end; gap: 8px;
               border-top: 1px solid var(--line); }
    .m-field { display: flex; flex-direction: column; gap: 5px; }
    .m-field > label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
    .m-row { display: flex; gap: 10px; align-items: center; }
    .modal input[type=text], .modal input[type=number], .modal select {
               background: #1d1d21; color: var(--text); border: 1px solid var(--line);
               border-radius: 6px; height: 30px; padding: 0 8px; }
    .modal input[type=text] { flex: 1; }
    .m-tracks { display: flex; flex-direction: column; gap: 8px; }
    .m-track { display: flex; gap: 8px; align-items: center; background: #26262b;
               border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .m-track select { flex: 1; }
    .m-del { background: var(--ctrl); border: 1px solid var(--line); border-radius: 6px; color: var(--dim);
               width: 28px; height: 28px; cursor: pointer; }
    .m-del:hover { background: #c0533a; color: #fff; }
    .m-add { align-self: flex-start; background: var(--ctrl); border: 1px solid var(--line);
               border-radius: 6px; color: var(--text); padding: 6px 12px; cursor: pointer; }
    .m-add:hover { background: var(--hover); }
    .m-btn { border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: 600; border: 1px solid var(--line); }
    .m-btn.ghost { background: var(--ctrl); color: var(--text); }
    .m-btn.ghost:hover { background: var(--hover); }
    .m-btn.primary { background: var(--accent); border-color: var(--accent2); color: #fff; }
    .m-btn.primary:hover { background: #9476ff; }
    .m-msg { color: var(--text); line-height: 1.5; }

    /* ---------- SVG icons ---------- */
    .ic { width: 16px; height: 16px; display: inline-block; vertical-align: middle;
          fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round;
          stroke-linejoin: round; pointer-events: none; flex: 0 0 auto; }
    .ic.sm { width: 13px; height: 13px; }
    .ic.lg { width: 20px; height: 20px; }
    .ic.xl { width: 24px; height: 24px; }
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    /* a button that holds only an icon centers it */
    .tp-btn .ic, .eb-btn .ic, .tk-mini .ic, .m-del .ic { display: block; margin: 0 auto; }
  </style>
</head>
<body>

  </defs></svg>

  <!-- ===== TOP TRANSPORT ===== -->
  <div id="transport">
    <div class="tp-group tp-left">
      <button id="sample-btn" class="tp-btn" title="Load sample"><svg class="ic"><use href="#ic-home"></use></svg></button>
      <span class="tp-views">
        <button class="tp-btn vw on" data-view="page" title="Page view"><svg class="ic"><use href="#ic-layout-page"></use></svg></button>
        <button class="tp-btn vw" data-view="vert" title="Vertical scroll"><svg class="ic"><use href="#ic-layout-vert"></use></svg></button>
        <button class="tp-btn vw" data-view="wide" title="Horizontal scroll"><svg class="ic"><use href="#ic-layout-wide"></use></svg></button>
      </span>
      <span class="tp-sep"></span>
      <svg class="ic tp-ic-static" aria-hidden="true"><use href="#ic-zoom"></use></svg>
      <button class="tp-btn" id="zoom-out" title="Zoom out"><svg class="ic"><use href="#ic-minus"></use></svg></button>
      <span id="zoom-pct">100%</span>
      <button class="tp-btn" id="zoom-in" title="Zoom in"><svg class="ic"><use href="#ic-plus"></use></svg></button>
      <span class="tp-sep"></span>
      <button class="tp-btn" title="Undo (⌘Z)" id="undo-btn"><svg class="ic"><use href="#ic-undo"></use></svg></button>
      <button class="tp-btn" title="Redo (⌘⇧Z)" id="redo-btn"><svg class="ic"><use href="#ic-redo"></use></svg></button>
      <button class="tp-btn" title="Print" id="print-btn"><svg class="ic"><use href="#ic-print"></use></svg></button>
      <span class="tp-sep"></span>
      <button class="tp-btn on tp-glyph" title="Toggle left palette" data-act="toggle:palette">◧</button>
      <button class="tp-btn on tp-glyph" title="Toggle right inspector" data-act="toggle:inspector">◨</button>
      <button class="tp-btn on tp-glyph" title="Toggle track list" data-act="toggle:tracks">▤</button>
      <button class="tp-btn tp-glyph" id="fullscore-btn" title="Full view (F11)" data-act="fullscore">⛶</button>
    </div>

    <div class="tp-group tp-center">
      <button class="tp-btn" title="Go to start" id="rewind-btn"><svg class="ic"><use href="#ic-skip-back"></use></svg></button>
      <button class="tp-btn tp-play" id="tp-play" title="Play / Stop (Space)"><svg class="ic lg"><use href="#ic-play"></use></svg></button>
      <button class="tp-btn" title="Go to end" id="forward-btn"><svg class="ic"><use href="#ic-skip-fwd"></use></svg></button>
      <span class="tp-sep"></span>
      <button class="tp-btn" id="record-btn" title="Record output to WAV"><svg class="ic"><use href="#ic-record"></use></svg></button>
      <button class="tp-btn" id="metro-btn" title="Metronome (click track)"><svg class="ic"><use href="#ic-metronome"></use></svg></button>
      <button class="tp-btn" id="countin-btn" title="Count-in (clicks + visual countdown before play)"><svg class="ic"><use href="#ic-timer"></use></svg></button>
      <select id="countin-bars" class="countin-bars" title="Count-in length"><option value="1">1 bar</option><option value="2">2 bars</option></select>
      <button class="tp-btn" id="liveinput-btn" title="Live input monitor (play on top of the tracks)"><svg class="ic"><use href="#ic-mic"></use></svg></button>
      <input type="range" id="ingain" min="0" max="200" value="100" title="Input gain" style="width:60px">
      <div id="vu" title="Output level"><div id="vu-fill"></div></div>

      <div id="tp-trackchip">
        <div id="tp-track-line"><svg class="ic sm" style="color:var(--accent)"><use href="#ic-guitar"></use></svg><span id="tp-track">—</span></div>
        <div id="tp-sub"><span id="tp-pos">bar 1 · beat 1</span><span id="tp-timesig" title="Time signature (click to change)">4/4</span><span class="tp-tempo">♩ = <input id="tempo" type="number" min="40" max="240" step="1" value="120" style="width:44px;height:20px;padding:0 4px;" /></span></div>
      </div>

      <button class="tp-btn" id="loop-btn" title="Loop selection (A/B)"><svg class="ic"><use href="#ic-loop"></use></svg></button>
      <span class="tp-speed"><svg class="ic sm" title="Practice speed"><use href="#ic-speed"></use></svg>
        <select id="speed-select" title="Practice speed (slow down without changing pitch)">
          <option value="0.25">25%</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
        </select>
      </span>
      <button class="tp-btn gd-soon" id="tuner-btn" title="Tuner (coming soon)" disabled><svg class="ic"><use href="#ic-tuner"></use></svg></button>
    </div>

    <div class="tp-group tp-right">
      <select id="new-select" title="New score">
        <option value="">New…</option>
        <option value="guitar">Guitar</option>
        <option value="bass">Bass</option>
        <option value="gb">Guitar + Bass</option>
        <option value="drums">Drums</option>
        <option value="band">Full Band</option>
      </select>
      <select id="addtrack-select" title="Add track">
        <option value="">+ Track…</option>
        <option value="guitar">Guitar</option>
        <option value="bass">Bass</option>
        <option value="drums">Drums</option>
      </select>
      <button id="openproj-btn" class="tp-btn"><svg class="ic sm"><use href="#ic-folder"></use></svg> Open</button>
      <button id="save-btn" class="tp-btn"><svg class="ic sm"><use href="#ic-save"></use></svg> Save</button>
      <select id="track-select" title="Shown tracks"></select>
      <span class="tp-sep"></span>
      <span class="tp-instr" title="Instrument display (visual)">
        <button class="tp-btn vw" data-instr="wave" title="Audio"><svg class="ic"><use href="#ic-wave"></use></svg></button>
        <button class="tp-btn vw on" data-instr="guitar" title="Guitar"><svg class="ic"><use href="#ic-guitar"></use></svg></button>
        <button class="tp-btn vw" data-instr="piano" title="Keys"><svg class="ic"><use href="#ic-piano"></use></svg></button>
        <button class="tp-btn vw" data-instr="drum" title="Drums"><svg class="ic"><use href="#ic-drum"></use></svg></button>
      </span>
      <span id="status">loading…</span>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <div id="main">
    <div id="palette"><div id="editbar"></div></div>

    <div id="center">
      <div id="at-wrap" tabindex="0"><div id="at"></div></div>
      <div id="beatlane-panel">
        <canvas id="beatlane-gutter"></canvas>
        <div id="beatlane-wrap"><canvas id="beatlane"></canvas></div>
      </div>
      <div id="fretboard"></div>
    </div>

    <div id="inspector"></div>
  </div>

  <!-- ===== BOTTOM TRACK LIST ===== -->
  <div id="tracks"></div>

  <input id="file-input" type="file" hidden />

  <!-- ===== MODAL (New score / confirm) ===== -->
  <div id="modal-overlay"><div class="modal" id="modal-box"></div></div>

  <script>
    // Icon helper: Icons.use('play','lg') -> '<svg class="ic lg">…<use href="#ic-play"></use></svg>'
    window.Icons = (function () {
      var ALIAS = { bass: 'guitar', open: 'folder' };
      function id(name) { return 'ic-' + (ALIAS[name] || name); }
      return {
        has: function (name) { return !!document.getElementById(id(name)); },
        use: function (name, cls) {
          return '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' +
            id(name) + '"></use></svg>';
        },
        // DOM-node variant
        el: function (name, cls) {
          var span = document.createElement('span');
          span.innerHTML = window.Icons.use(name, cls);
          return span.firstChild;
        }
      };
    })();

    // Visual single-select clusters (page-view + instrument-view) + loop toggle.
    document.addEventListener('click', function (e) {
      var vw = e.target.closest && e.target.closest('.vw');
      if (vw && (vw.parentElement.classList.contains('tp-views') || vw.parentElement.classList.contains('tp-instr'))) {
        vw.parentElement.querySelectorAll('.vw').forEach(function (b) { b.classList.remove('on'); });
        vw.classList.add('on');
        return;
      }
      var loop = e.target.closest && e.target.closest('#loop-btn');
      if (loop) {
        var on = loop.classList.toggle('on');
        if (window.gomidasMenu) window.gomidasMenu(on ? 'loopsel' : 'loopclear');
      }
    });
  </script>
  <script src="juce_native_interop.js"></script>

  <script src="dist/core/sfz.js"></script>
  <script src="dist/core/fx.js"></script>
  <script src="dist/core/sf2.js"></script>
  <script src="dist/core/webfiles.js"></script>
  <script src="dist/core/menus.js"></script>
  <script src="dist/core/webaudio.js"></script>
  <script src="dist/core/backend.js"></script>
  <script src="dist/grooves.js"></script>
  <script src="dist/editor.js"></script>
  <script src="dist/fretboard.js"></script>
  <script src="dist/app.js"></script>
  <script src="dist/core/webshell.js"></script>
</body>
