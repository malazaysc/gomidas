name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, reliable gate: pure-logic unit tests for the WebView layer (Vitest).
  # Runs in seconds — no native toolchain, no JUCE/sfizz fetch. See docs/TESTING.md.
  web-tests:
    name: Web unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm before setup-node, so setup-node's cache can find the store (GMD-63).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # One install at the workspace root covers both packages.
      - run: pnpm install --frozen-lockfile
      # GMD-68 — the plain-<script> editor files have no typecheck (checkJs is off in the main
      # tsconfig on purpose), so a reference to something that does not exist is invisible until
      # that line runs. GMD-67 shipped exactly that and silenced note audition on both products
      # for a day. Runs in ~0.3s, so it goes first: cheapest check, fastest failure.
      - name: Dangling-reference sweep (checkJs)
        run: pnpm -C packages/core run sweep
      - run: pnpm -C packages/core run test

  # Native build + audio-path smoke tests, on both desktop platforms the app ships on. Heavier:
  # configures with -DGOMIDAS_BUILD_TESTS=ON, which fetches JUCE 8 + builds sfizz.
  # Builds the full Gomidas APP too, not just the test targets (GOM-89): development moved to
  # Linux, so nothing else compiles the macOS app, and nothing else compiles the Linux one.
  native-tests:
    name: Native build + smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false   # a Linux break must not hide whether macOS still builds, and vice versa
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # JUCE's Linux dependencies. NEEDS_WEB_BROWSER (GOM-84) makes configure require
      # webkit2gtk-4.1 + gtk3 through pkg-config; the rest is JUCE's standard list.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev
      # The web front-end is TypeScript and CMake compiles it during configure
      # (GMD-31, docs/WEB_PORT.md §1.1), so the native job needs Node and pnpm too — CMake
      # shells out to `pnpm exec tsc` and hard-fails if pnpm is missing.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install web deps (for tsc)
        run: pnpm install --frozen-lockfile
      - name: Cache CMake FetchContent deps (JUCE, sfizz)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DGOMIDAS_BUILD_TESTS=ON
      - name: Build app + test targets
        run: cmake --build build --parallel 4
      - name: Run ctest
        run: ctest --test-dir build --output-on-failure
