name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, reliable gate: pure-logic unit tests for the WebView layer (Vitest).
  # Runs in seconds — no native toolchain, no JUCE/sfizz fetch. See docs/TESTING.md.
  web-tests:
    name: Web unit tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  # Native audio-path smoke tests (sfizz SFZ load + render) via ctest. Heavier: this
  # configures with -DGOMIDAS_BUILD_TESTS=ON, which fetches JUCE 8 + builds sfizz.
  native-tests:
    name: Native smoke tests (ctest, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache CMake FetchContent deps (JUCE, sfizz)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DGOMIDAS_BUILD_TESTS=ON
      - name: Build test target
        run: cmake --build build --target sfz_smoketest
      - name: Run ctest
        run: ctest --test-dir build --output-on-failure
